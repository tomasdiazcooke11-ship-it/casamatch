<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CasaMatch</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172b3a}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{height:64px;background:#fff;border-bottom:1px solid #e5eaf0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.logo{font-size:23px;font-weight:800}.logo b{color:#4f8ef7}.main{max-width:1100px;margin:auto;padding:28px 18px}.hero{text-align:center;padding:45px 5px}.hero h1{font-size:48px;margin:8px 0}.hero h1 span{color:#4f8ef7}.hero p{color:#697887;font-size:17px}.roles,.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#fff;border:1px solid #e5eaf0;border-radius:20px;padding:22px;box-shadow:0 8px 25px #172b3a0c;margin-bottom:18px}.role{padding:30px;text-align:left}.role:hover{transform:translateY(-2px)}.btn{background:#4f8ef7;color:#fff;padding:11px 16px;border-radius:11px;font-weight:700}.secondary{background:#edf4ff;color:#326fd8}.danger{background:#fff0f1;color:#c13e4a}.layout{display:grid;grid-template-columns:210px 1fr;gap:20px}.side{background:#fff;border:1px solid #e5eaf0;border-radius:18px;padding:10px;height:max-content;position:sticky;top:82px}.nav{width:100%;text-align:left;background:transparent;padding:12px;border-radius:10px;color:#687887;font-weight:700}.nav:hover,.active{background:#edf4ff;color:#326fd8}.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #dfe6ec;border-radius:10px;padding:11px}.muted{color:#6b7a88}.pill{display:inline-block;padding:5px 9px;background:#edf4ff;color:#326fd8;border-radius:99px;font-size:12px;font-weight:800}.compat{font-size:23px;font-weight:900;color:#258b74}.person{display:flex;gap:13px}.avatar{width:52px;height:52px;border-radius:15px;background:#e5f1ff;display:grid;place-items:center;font-size:24px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.map{height:390px;border-radius:17px;background:#e6f0e8;position:relative;overflow:hidden;background-image:linear-gradient(25deg,transparent 48%,#ffffffaa 49%,#ffffffaa 51%,transparent 52%),linear-gradient(115deg,transparent 48%,#ffffffaa 49%,#ffffffaa 51%,transparent 52%)}.pin{position:absolute;background:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 7px 20px #0002;font-size:12px;font-weight:bold}.faq{display:grid;grid-template-columns:1fr 1fr;gap:9px}.faq button{text-align:left;padding:12px;border:1px solid #e2e8ee;border-radius:11px;background:#f6f8fa}.messages{height:330px;overflow:auto;background:#f7f9fc;padding:12px;border-radius:14px}.bubble{max-width:75%;padding:10px 12px;border-radius:14px;margin:7px 0}.me{margin-left:auto;background:#ddebff}.them{background:#fff;border:1px solid #e5eaf0}.chatbar{display:flex;gap:8px;margin-top:9px}.chatbar input{flex:1;padding:11px;border:1px solid #dfe6ec;border-radius:10px}.hidden{display:none}.toast{position:fixed;right:18px;bottom:18px;background:#172b3a;color:#fff;padding:12px 15px;border-radius:10px;z-index:20;max-width:420px}.error{color:#b42318;background:#fff0f0;border:1px solid #ffd0d0;border-radius:10px;padding:10px;margin-top:10px}.ok{color:#126b45;background:#edfff6;border:1px solid #bdebd4;border-radius:10px;padding:10px;margin-top:10px}@media(max-width:760px){.roles,.cards,.two,.three,.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.nav{min-width:max-content}.hero h1{font-size:37px}}
</style>
</head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   CASAMATCH - CONFIGURACIÓN
   Pegá SOLO tu API URL y tu PUBLISHABLE KEY.
   Nunca pongas una sb_secret_... en este archivo.
   ========================================================== */
const SUPABASE_URL="https://pybizeqornnakgxcund.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_zgwKhwKZhS3MQhtFun1ZtQ_tXwe7ibS";

const sb=(SUPABASE_URL.startsWith("https://") && SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_"))
  ? window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY)
  : null;

const S={role:null,screen:"landing",step:1,user:null,draft:null,authUser:null};
const A=document.getElementById("app");
function toast(x){const d=document.createElement("div");d.className="toast";d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function v(id){return document.getElementById(id)?.value?.trim()||""}
function go(x){S.screen=x;render()}
function start(r){S.role=r;S.step=1;S.draft={};S.screen="register";render()}

function landing(){return `<div class="hero"><span class="pill">MVP interactivo · CasaMatch</span><h1>Encontrá la persona<br><span>adecuada para tu hogar.</span></h1><p>Conectamos personas que buscan trabajo en casas particulares con quienes necesitan contratar.</p><div class="roles"><div class="card role" onclick="start('worker')"><div style="font-size:38px">👩‍💼</div><h2>Quiero trabajar</h2><p class="muted">Perfil, experiencia, disponibilidad y movilidad.</p><button class="btn">Crear perfil →</button></div><div class="card role" onclick="start('employer')"><div style="font-size:38px">🏠</div><h2>Quiero contratar</h2><p class="muted">Buscá perfiles compatibles por zona y horarios.</p><button class="btn">Buscar ayuda →</button></div></div><div style="margin-top:20px"><button class="btn secondary" onclick="goLogin()">Ya tengo una cuenta · Iniciar sesión</button></div></div>`}

function register(){
 const w=S.role==="worker";
 const d=S.draft||{};
 const step1 = `<div class="grid two">
  <div class="field"><label>Nombre y apellido</label><input id="name" value="${esc(d.name)}"></div>
  <div class="field"><label>Email</label><input id="email" type="email" value="${esc(d.email)}" autocomplete="email"></div>
  <div class="field"><label>Contraseña</label><input id="password" type="password" minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>
  <div class="field"><label>Teléfono</label><input id="phone" value="${esc(d.phone)}"></div>
  <div class="field"><label>Zona</label><input id="zone" placeholder="Ej. Cerro de las Rosas" value="${esc(d.zone)}"></div>
  ${w
    ? `<div class="field"><label>DNI</label><input id="dni" inputmode="numeric" value="${esc(d.dni)}"></div><div class="field"><label>Experiencia</label><input id="exp" placeholder="Ej. 5 años" value="${esc(d.exp)}"></div>`
    : `<div class="field"><label>Qué necesitás</label><select id="service"><option>Limpieza</option><option>Limpieza + cocina</option><option>Cuidado de niños</option><option>Cuidado de adultos</option><option>Planchado</option></select></div><div class="field"><label>Frecuencia</label><select id="freq"><option>1 vez por semana</option><option>2 veces por semana</option><option>3 veces por semana</option><option>Todos los días</option></select></div>`}
 </div>
 <div class="actions"><button class="btn" onclick="next()">Continuar →</button></div>`;
 const step2 = w
   ? `<div class="grid two"><div class="field"><label>CV / experiencia</label><textarea id="cv" rows="4">${esc(d.cv)}</textarea></div><div class="field"><label>Servicios</label><select id="services"><option>Limpieza general</option><option>Limpieza + cocina</option><option>Cocina</option><option>Cuidado de niños</option></select></div><div class="field"><label>Medio de transporte</label><select id="transport"><option>Colectivo</option><option>Auto</option><option>Moto</option><option>Remis / taxi</option><option>Bicicleta</option><option>Caminando</option></select></div><div class="field"><label>Tiempo máximo de viaje</label><select id="travel"><option>15 minutos</option><option selected>30 minutos</option><option>45 minutos</option><option>60 minutos</option></select></div><div class="field"><label>Disponibilidad</label><input id="avail" placeholder="Ej. martes y jueves, 9 a 13" value="${esc(d.avail)}"></div><div class="field"><label>Identidad</label><input value="La verificación se implementará con carga privada de DNI + selfie" disabled></div></div>`
   : `<div class="grid two"><div class="field"><label>Días y horarios</label><input id="avail" placeholder="Ej. martes y jueves, 9 a 13" value="${esc(d.avail)}"></div><div class="field"><label>Presupuesto</label><input id="budget" placeholder="Ej. $X por hora" value="${esc(d.budget)}"></div><div class="field"><label>Distancia máxima</label><select id="travel"><option>15 minutos</option><option selected>30 minutos</option><option>45 minutos</option><option>60 minutos</option></select></div><div class="field"><label>Preferencias</label><input id="pref" value="${esc(d.preferences)}"></div></div>`;
 const body = S.step===1 ? step1 : `${step2}<div class="actions"><button class="btn secondary" onclick="saveStep2();S.step=1;render()">← Atrás</button><button class="btn" onclick="finish()">Crear cuenta</button></div>`;
 return `<div class="main"><div class="card" style="max-width:760px;margin:auto"><button class="btn secondary" onclick="S.screen='landing';S.draft=null;render()">← Volver</button><h2>${w?"Crear perfil de trabajadora":"Crear cuenta de empleador/a"}</h2><p class="muted">Paso ${S.step} de 2</p>${body}</div></div>`;
}
function next(){
 const name=v("name"),email=v("email"),password=v("password");
 if(!name||!email||!password)return toast("Completá nombre, email y contraseña");
 if(!/^\S+@\S+\.\S+$/.test(email))return toast("Ingresá un email válido");
 if(password.length<6)return toast("La contraseña debe tener al menos 6 caracteres");
 S.draft={...(S.draft||{}),name,email,password,phone:v("phone"),zone:v("zone"),dni:v("dni"),exp:v("exp"),service:v("service"),freq:v("freq")};
 S.step=2;render();
}
function saveStep2(){
 S.draft={...(S.draft||{}),avail:v("avail")||S.draft?.avail||"",travel:v("travel")||S.draft?.travel||"30 minutos",transport:v("transport")||S.draft?.transport||"No informado",budget:v("budget")||S.draft?.budget||"",preferences:v("pref")||S.draft?.preferences||"",cv:v("cv")||S.draft?.cv||"",services:v("services")||S.draft?.services||""};
}
function numTravel(x){return parseInt(String(x||"30").match(/\d+/)?.[0]||"30",10)}

async function finish(){
 saveStep2();
 if(!sb)return toast("Supabase no está configurado. Revisá SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY.");
 const d=S.draft||{};
 if(!d.name||!d.email||!d.password)return toast("Faltan datos del paso 1");
 if(d.password.length<6)return toast("La contraseña debe tener al menos 6 caracteres");
 const {data,error}=await sb.auth.signUp({email:d.email,password:d.password});
 if(error)return toast("No se pudo crear la cuenta: "+error.message);
 if(!data.user)return toast("Supabase no devolvió el usuario creado.");
 if(!data.session){
   return toast("La cuenta fue creada, pero Supabase pide confirmar el email. Para esta prueba desactivá Confirm email en Authentication → Providers → Email y volvé a probar con otro email.");
 }
 const profile={auth_user_id:data.user.id,nombre:d.name,email:d.email,telefono:d.phone||"",tipo_usuario:S.role,zona:d.zone||"",disponibilidad:d.avail||"A coordinar",experiencia:d.cv||d.exp||"",servicios:d.service||d.services||"",transporte:d.transport||"No informado",tiempo_maximo_viaje:numTravel(d.travel)};
 const {error:pe}=await sb.from("profiles").insert(profile);
 if(pe){await sb.auth.signOut();return toast("La cuenta se creó, pero el perfil no pudo guardarse: "+pe.message)}
 S.authUser=data.user;S.user={name:profile.nombre,email:profile.email,phone:profile.telefono,zone:profile.zona,service:profile.servicios,avail:profile.disponibilidad,travel:profile.tiempo_maximo_viaje+" minutos",transport:profile.transporte};S.draft=null;S.screen="home";render();
}

function goLogin(){S.screen="login";render()}
function login(){return `<div class="main"><div class="card" style="max-width:520px;margin:45px auto"><button class="btn secondary" onclick="S.screen='landing';render()">← Volver</button><h1>Iniciar sesión</h1><p class="muted">Entrá a tu cuenta de CasaMatch.</p><div class="grid"><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password"></div></div><div class="actions"><button class="btn" onclick="doLogin()">Iniciar sesión</button></div></div></div>`}
async function doLogin(){
 if(!sb)return toast("Supabase no está configurado en este archivo.");
 const email=v("loginEmail"),password=v("loginPassword");if(!email||!password)return toast("Completá email y contraseña");
 const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return toast("No se pudo iniciar sesión: "+error.message);
 const {data:p,error:pe}=await sb.from("profiles").select("*").eq("auth_user_id",data.user.id).maybeSingle();
 if(pe)return toast("No pude cargar tu perfil: "+pe.message);
 if(!p)return toast("La cuenta existe, pero no hay perfil asociado.");
 S.authUser=data.user;S.role=p.tipo_usuario;S.user={name:p.nombre,email:p.email,phone:p.telefono,zone:p.zona,service:p.servicios,avail:p.disponibilidad,travel:(p.tiempo_maximo_viaje||30)+" minutos",transport:p.transporte};S.screen="home";render();
}
async function logout(){if(sb)await sb.auth.signOut();S.role=null;S.user=null;S.authUser=null;S.draft=null;S.screen="landing";render()}

function shell(c){return `<div class="top"><div class="logo">Casa<b>Match</b></div><div><span class="muted" style="margin-right:10px">${esc(S.user?.name)}</span><button class="btn secondary" onclick="logout()">Cerrar sesión</button></div></div><div class="main"><div class="layout"><aside class="side">${["home|⌂ Inicio","proposals|✦ Mis propuestas","map|⌖ Mapa","chat|◌ Mensajes","assistant|✦ Mi asistente","profile|◎ Mi perfil"].map(x=>{let[a,b]=x.split("|");return `<button class="nav ${S.screen===a?"active":""}" onclick="go('${a}')">${b}</button>`}).join("")}${S.role==="employer"?`<button class="nav" onclick="go('search')">⌕ Buscar</button>`:""}</aside><main>${c}</main></div></div>`}
function card(n,service,dist,time,pct,reason){return `<div class="card"><div class="person"><div class="avatar">👤</div><div style="flex:1"><h3>${esc(n)}</h3><div class="muted">${service}<br>${dist}<br>${time}</div></div><div class="compat">${pct}</div></div><p class="muted">${esc(reason)}</p><div class="actions"><button class="btn" onclick="toast('Perfil seleccionado')">Ver perfil</button><button class="btn secondary" onclick="go('chat')">Chat</button></div></div>`}
function home(){if(S.role==="worker")return `<div class="card"><span class="pill">Perfil activo</span><h1>Hola, ${esc(S.user.name.split(" ")[0])} 👋</h1><p class="muted">Estas son algunas propuestas compatibles.</p></div><div class="cards">${card("Laura · Cerro de las Rosas","🏠 Limpieza + cocina","📍 3,2 km · 🚌 24 min aprox.","📅 Martes y jueves · 9 a 13","92%","Coincide con tu disponibilidad y servicios.")}${card("Sofía · Villa Belgrano","🏠 Limpieza general","📍 5,1 km · 🚌 36 min aprox.","📅 Viernes · 14 a 18","84%","Buena coincidencia; el traslado es mayor.")}</div>`;return `<div class="card"><span class="pill">Búsqueda inteligente</span><h1>Hola, ${esc(S.user.name.split(" ")[0])} 👋</h1><p class="muted">Encontrá perfiles compatibles con tus necesidades.</p><button class="btn" onclick="go('search')">Buscar una persona →</button></div><div class="cards">${card("María González","🧹 Limpieza + cocina","📍 3,2 km · 🚌 24 min aprox.","📅 Martes y jueves · 9 a 13","94%","Coincide en tareas, horarios y zona.")}${card("Carla López","🧹 Limpieza general","📍 5,4 km · 🚗 18 min aprox.","📅 Martes y jueves · 9 a 13","89%","Muy buena coincidencia.")}</div>`}
function proposals(){return `<div class="card"><h1>Mis propuestas</h1><p class="muted">Gestioná propuestas enviadas y recibidas.</p>${S.role==="worker"?`<h3>Propuesta recibida · Laura</h3><p>🧹 Limpieza + cocina · 📅 Martes y jueves · 9 a 13</p><div class="actions"><button class="btn" onclick="toast('Propuesta aceptada')">Aceptar</button><button class="btn danger" onclick="toast('Propuesta rechazada')">Rechazar</button></div>`:`<h3>Propuesta enviada · María González</h3><p>🧹 Limpieza + cocina · 📅 Martes y jueves · 9 a 13</p><span class="pill">Pendiente</span>`}</div>`}
function map(){return `<div class="card"><h1>Mapa</h1><p class="muted">Zonas y distancias aproximadas.</p><div class="map"><div class="pin" style="left:20%;top:30%">María · 3,2 km</div><div class="pin" style="left:57%;top:53%">Carla · 5,4 km</div><div class="pin" style="left:38%;top:73%">Tu ubicación</div></div><p class="muted" style="font-size:12px">En producción, las distancias se calcularán con un servicio de mapas y ubicación autorizada.</p></div>`}
function chat(){return `<div class="card"><h2>Mensajes</h2><div class="messages" id="msgs"><div class="bubble them">Hola! ¿Querés que coordinemos para conocernos?</div><div class="bubble me">Sí, ¿el horario es fijo?</div><div class="bubble them">Sí, martes y jueves de 9 a 13.</div></div><div class="chatbar"><input id="msg" placeholder="Escribí un mensaje..." onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Enviar</button></div></div>`}
function send(){const x=v("msg");if(!x)return;document.getElementById("msgs").innerHTML+=`<div class="bubble me">${esc(x)}</div>`;document.getElementById("msg").value="";setTimeout(()=>document.getElementById("msgs").innerHTML+=`<div class="bubble them">Perfecto, podemos coordinarlo por este chat 😊</div>`,500)}
function assistant(){const worker=S.role==="worker";const qs=worker?["¿Me corresponde aguinaldo?","¿Qué pasa si no me pagan?","¿Me tienen que registrar?","¿Qué debería preguntar antes de aceptar?"]:["¿Tengo que registrar a la trabajadora?","¿Cómo se calculan vacaciones y aguinaldo?","¿Qué pasa si falta o llega tarde?","¿Qué debería preguntarle antes de contratar?"];return `<div class="card"><span class="pill">${worker?"Asistente para trabajadoras":"Asistente para empleadores"}</span><h1>Mi asistente</h1><p class="muted">Consultas frecuentes y herramientas de preparación.</p><div class="faq">${qs.map(q=>`<button onclick="faq('${q.replaceAll("'","\\'")}')">${q}</button>`).join("")}</div></div><div class="card"><h2>${worker?"🎤 Simular entrevista":"✍️ Simular propuesta"}</h2><p class="muted">${worker?"Practicá una entrevista antes de una reunión real.":"Armá una propuesta clara antes de enviarla."}</p><button class="btn" onclick="${worker?"interview()":"proposal()"}">${worker?"Comenzar entrevista":"Iniciar simulación"}</button><div id="sim"></div></div>`}
function faq(q){const m={"¿Me corresponde aguinaldo?":"El personal de casas particulares registrado tiene derecho al aguinaldo. Para un cálculo concreto hay que revisar la normativa vigente.","¿Qué pasa si no me pagan?":"Conviene guardar comprobantes y comunicaciones y buscar asesoramiento por canales oficiales.","¿Me tienen que registrar?":"La relación laboral de casas particulares debe registrarse independientemente de la cantidad de horas trabajadas.","¿Qué debería preguntar antes de aceptar?":"Confirmá tareas, horarios, remuneración, registración, dirección, transporte y condiciones.","¿Tengo que registrar a la trabajadora?":"La relación laboral de casas particulares debe registrarse independientemente de la cantidad de horas trabajadas.","¿Cómo se calculan vacaciones y aguinaldo?":"Depende de modalidad y antigüedad; para un cálculo definitivo hay que consultar la normativa oficial vigente.","¿Qué pasa si falta o llega tarde?":"Conviene dejar claras las condiciones y documentar cambios o incumplimientos.","¿Qué debería preguntarle antes de contratar?":"Experiencia, tareas, días, horarios, remuneración, registración, referencias si corresponde y ubicación."};toast(m[q]||"Podemos revisar esa situación paso a paso.")}
function proposal(){document.getElementById("sim").innerHTML=`<div class="card" style="margin-top:15px"><div class="grid two"><div class="field"><label>Días</label><input id="pd" value="Martes y jueves"></div><div class="field"><label>Horario</label><input id="ph" value="9:00 a 13:00"></div><div class="field"><label>Tareas</label><input id="pt" value="Limpieza + cocina"></div><div class="field"><label>Zona</label><input id="pz" value="${esc(S.user.zone)}"></div></div><button class="btn" style="margin-top:12px" onclick="genP()">Generar propuesta</button><div id="out"></div></div>`}
function genP(){document.getElementById("out").innerHTML=`<div class="card" style="margin-top:12px"><b>Propuesta sugerida</b><p>Hola, estoy buscando una persona para realizar <b>${esc(v("pt"))}</b>, los <b>${esc(v("pd"))}</b>, de <b>${esc(v("ph"))}</b>, en la zona de <b>${esc(v("pz"))}</b>. Me gustaría coordinar una conversación para conocer disponibilidad, experiencia y condiciones.</p></div>`}
function interview(){document.getElementById("sim").innerHTML=`<div class="card" style="margin-top:15px"><b>Entrevistador/a</b><p>Hola. Para comenzar, contame brevemente qué experiencia tenés trabajando en casas particulares y qué tareas realizás con mayor frecuencia.</p><textarea id="ia" rows="4" placeholder="Escribí tu respuesta..."></textarea><button class="btn" style="margin-top:10px" onclick="evalI()">Responder</button><div id="io"></div></div>`}
function evalI(){if(!v("ia"))return toast("Escribí una respuesta");document.getElementById("io").innerHTML=`<div class="card" style="margin-top:12px"><b>Devolución</b><p>Intentá mencionar años de experiencia, tareas específicas y disponibilidad. En una entrevista real, cuanto más concreta sea la respuesta, mejor.</p><button class="btn secondary" onclick="interview()">Siguiente pregunta</button></div>`}
function profile(){return `<div class="card"><h1>${esc(S.user.name)}</h1><p class="muted">${S.role==="worker"?"Trabajadora":"Empleador/a"} · ${esc(S.user.zone)}</p><div class="grid two"><p><b>Email</b><br>${esc(S.user.email)}</p><p><b>Teléfono</b><br>${esc(S.user.phone)}</p><p><b>Disponibilidad</b><br>${esc(S.user.avail)}</p><p><b>Movilidad</b><br>${esc(S.user.transport)}</p><p><b>Distancia</b><br>${esc(S.user.travel)}</p><p><b>Servicio</b><br>${esc(S.user.service)}</p></div></div>`}
function search(){return `<div class="card"><h1>Buscar una persona</h1><div class="grid three"><div class="field"><label>Servicio</label><select><option>Limpieza</option><option>Limpieza + cocina</option><option>Cuidado de niños</option></select></div><div class="field"><label>Días</label><input placeholder="Ej. martes y jueves"></div><div class="field"><label>Distancia</label><select><option>15 min</option><option selected>30 min</option><option>45 min</option></select></div></div></div><div class="cards">${card("María González","🧹 Limpieza + cocina","📍 3,2 km · 🚌 24 min aprox.","📅 Martes y jueves · 9 a 13","94%","Coincide con tus criterios.")}${card("Carla López","🧹 Limpieza general","📍 5,4 km · 🚗 18 min aprox.","📅 Martes y jueves · 9 a 13","89%","Muy buena coincidencia.")}</div>`}
function render(){let c;if(S.screen==="landing")c=landing();else if(S.screen==="register")c=register();else if(S.screen==="login")c=login();else{const fn={home,proposals,map,chat,assistant,profile,search}[S.screen]||home;c=shell(fn())}A.innerHTML=c}
render();
</script></body></html>
